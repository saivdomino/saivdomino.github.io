<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1128">
<title>SaivDOMINO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="style.css">
</head>
<body data-v="auth">
<header class="bar">
  <div class="logo">Saiv<span>DOMINO</span></div>
  <div class="flex gap-2 items-center"><button class="snd icon"></button>
    <select id="lang" class="in"><option value="ar">AR</option><option value="en">EN</option><option value="fr">FR</option></select></div>
</header>
<main class="max-w-md mx-auto p-4">

<section id="v-auth" class="v flex flex-col gap-4">
  <div id="hero" class="hero"></div>
  <h1 class="title">SaivDOMINO</h1>
  <div class="card">
    <input id="email" class="in" type="email" data-ph="email" autocomplete="email">
    <input id="pass" class="in" type="password" data-ph="pass" autocomplete="current-password">
    <input id="uname" class="in" data-ph="uname">
    <div class="flex gap-2"><button id="login" class="btn flex-1" data-i18n="login"></button><button id="signup" class="btn alt flex-1" data-i18n="signup"></button></div>
    <p id="autherr" class="err"></p>
  </div>
</section>

<section id="v-menu" class="v hidden flex flex-col gap-4">
  <div id="stats" class="card"></div>
  <div class="card">
    <b data-i18n="vsBot"></b>
    <div class="grid grid-cols-3 gap-2">
      <select id="bn" class="in !w-full"><option value="2">1v1</option><option value="4">2v2</option></select>
      <select id="bl" class="in !w-full"><option value="easy" data-i18n="easy"></option><option value="medium" data-i18n="medium"></option><option value="hard" data-i18n="hard"></option></select>
      <select id="bt" class="in !w-full"><option>100</option><option>150</option></select>
    </div>
    <button id="startBot" class="btn" data-i18n="start"></button>
  </div>
  <div class="card">
    <div class="flex gap-2"><select id="cm" class="in !w-auto"><option value="2">1v1</option><option value="4">2v2</option><option value="3" data-i18n="free"></option></select><button id="createRoom" class="btn flex-1" data-i18n="create"></button></div>
    <div class="flex gap-2"><input id="rcode" class="in" data-ph="code" maxlength="5"><button id="joinRoom" class="btn alt" data-i18n="join"></button></div>
  </div>
  <div class="grid grid-cols-2 gap-2"><button id="toLb" class="btn alt" data-i18n="lb"></button><button id="toSet" class="btn alt" data-i18n="look"></button><button id="toProf" class="btn alt" data-i18n="profile"></button><button id="logout" class="btn alt" data-i18n="logout"></button></div>
</section>

<section id="v-lobby" class="v hidden flex flex-col gap-4">
  <div class="card text-center"><span data-i18n="code"></span><b id="roomcode" class="text-4xl tracking-widest" style="color:var(--gold)"></b></div>
  <div id="lobbyInfo" class="text-center font-bold"></div>
  <div id="lobbylist" class="flex flex-col gap-2"></div>
  <div id="hostbox" class="hidden card">
    <div id="tnbox" class="flex flex-col gap-2"><b data-i18n="teamNames"></b>
    <div class="flex gap-2"><input id="tn1" class="in" data-ph="team1"><input id="tn2" class="in" data-ph="team2"></div></div>
    <select id="rt" class="in !w-full"><option>100</option><option>150</option></select>
    <button id="startRoom" class="btn" data-i18n="start"></button>
  </div>
  <button id="backL" class="btn alt" data-i18n="back"></button>
</section>

<section id="v-lb" class="v hidden flex flex-col gap-4">
  <div class="card"><b data-i18n="lb"></b><div id="statsBox" class="flex flex-col gap-2"></div></div>
  <div class="card"><b data-i18n="history"></b><ul id="hist"></ul></div>
  <button id="backLb" class="btn alt" data-i18n="back"></button>
</section>

<section id="v-settings" class="v hidden flex flex-col gap-4">
  <div class="card"><b data-i18n="look"></b><div class="flex gap-2"><button id="mDark" class="btn alt flex-1" data-i18n="night"></button><button id="mLight" class="btn alt flex-1" data-i18n="day"></button></div></div>
  <div id="pv" class="pv"></div>
  <div class="card"><b data-i18n="tableStyle"></b><div id="tblGrid" class="sw"></div></div>
  <div class="card"><b data-i18n="tileStyle"></b><div id="tileGrid" class="sw"></div></div>
  <button id="backSet" class="btn alt" data-i18n="back"></button>
</section>

<section id="v-profile" class="v hidden flex flex-col gap-4">
  <div class="card"><b data-i18n="uname"></b><input id="pname" class="in" maxlength="20"><button id="saveName" class="btn" data-i18n="save"></button></div>
  <div class="card"><b data-i18n="email"></b><input id="pemail" class="in" type="email"><button id="saveEmail" class="btn alt" data-i18n="save"></button></div>
  <div class="card"><b data-i18n="pass"></b><input id="np" class="in" type="password" data-ph="newPass" autocomplete="new-password"><input id="np2" class="in" type="password" data-ph="newPass2" autocomplete="new-password"><button id="savePass" class="btn" data-i18n="save"></button></div>
  <button id="backProf" class="btn alt" data-i18n="back"></button>
</section>
</main>

<section id="v-game" class="v hidden">
  <div id="gtop">
    <div id="sc"></div>
    <div class="flex gap-2"><button id="infoBtn" class="icon hidden">!</button><button class="snd icon"></button><button id="exitG" class="icon">✕</button><button id="backG" class="btn hidden" data-i18n="back"></button></div>
  </div>
  <div id="idle" class="hidden"><span>⏱ <span data-i18n="idleWarn"></span> <b id="idleN">5</b></span><button id="idleX" class="btn alt">✕</button></div>
  <div id="opps"></div>
  <div id="stage"><div id="board"></div><div id="bone" class="bone hidden"></div><div id="result" class="hidden"></div></div>
  <div id="dock">
    <div id="backBar" class="hidden"><span data-i18n="botPlays"></span><button id="imBack" class="btn" data-i18n="imBack"></button></div>
    <p id="msg" class="msg"></p>
    <div id="choose" class="hidden flex gap-3" style="direction:ltr"><button id="cl" class="btn">◀</button><button id="cr" class="btn">▶</button></div>
    <button id="drawBtn" class="btn hidden" data-i18n="draw"></button>
    <div id="hand"></div>
    <div id="taunts"></div>
  </div>
</section>
<div id="info" class="hidden"><div class="card"><b data-i18n="roomInfo"></b><div id="infoBody" class="flex flex-col gap-2"></div><button id="infoX" class="btn alt" data-i18n="close"></button></div></div>
<div id="toast" class="hidden"></div>
<script type="module" src="app.js"></script>
</body>
</html>
