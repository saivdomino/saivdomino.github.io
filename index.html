<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SaivDOMINO</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-white min-h-screen">
<header class="flex justify-between items-center p-3 bg-slate-800">
  <b class="text-xl">SaivDOMINO</b>
  <select id="lang" class="!w-auto"><option value="ar">AR</option><option value="en">EN</option><option value="fr">FR</option></select>
</header>
<main class="max-w-3xl mx-auto p-3">

<section id="v-auth" class="v space-y-2">
  <input id="email" type="email" data-ph="email">
  <input id="pass" type="password" data-ph="pass">
  <input id="uname" data-ph="uname">
  <div class="flex gap-2"><button id="login" class="btn" data-i18n="login"></button><button id="signup" class="btn alt" data-i18n="signup"></button></div>
  <p id="autherr" class="text-yellow-300"></p>
</section>

<section id="v-menu" class="v hidden space-y-3">
  <div id="stats" class="bg-slate-800 rounded p-3"></div>
  <div class="bg-slate-800 rounded p-3 space-y-2">
    <b data-i18n="vsBot"></b>
    <div class="grid grid-cols-3 gap-2">
      <select id="bn"><option value="2">1v1</option><option value="4">2v2</option></select>
      <select id="bl"><option value="easy" data-i18n="easy"></option><option value="medium" data-i18n="medium"></option><option value="hard" data-i18n="hard"></option></select>
      <select id="bt"><option>100</option><option>150</option></select>
    </div>
    <button id="startBot" class="btn" data-i18n="start"></button>
  </div>
  <div class="bg-slate-800 rounded p-3 space-y-2">
    <button id="createRoom" class="btn" data-i18n="create"></button>
    <div class="flex gap-2"><input id="rcode" data-ph="code" maxlength="5"><button id="joinRoom" class="btn" data-i18n="join"></button></div>
  </div>
  <div class="flex gap-2"><button id="toLb" class="btn alt" data-i18n="lb"></button><button id="logout" class="btn alt" data-i18n="logout"></button></div>
</section>

<section id="v-lobby" class="v hidden space-y-3">
  <div class="text-center"><span data-i18n="code"></span>: <b id="roomcode" class="text-3xl tracking-widest"></b></div>
  <div id="lobbylist" class="space-y-2"></div>
  <div id="hostbox" class="hidden space-y-2">
    <select id="rt"><option>100</option><option>150</option></select>
    <button id="startRoom" class="btn" data-i18n="start"></button>
  </div>
  <button id="backL" class="btn alt" data-i18n="back"></button>
</section>

<section id="v-game" class="v hidden">
  <div class="flex justify-between items-center mb-2"><b id="sc"></b><button id="backG" class="btn alt hidden" data-i18n="back"></button></div>
  <div id="opps" class="flex flex-wrap gap-2 mb-2"></div>
  <div id="table"><div id="board"></div></div>
  <div id="choose" class="hidden flex gap-2 justify-center my-2" style="direction:ltr">
    <button id="cl" class="btn">◀</button><button id="cr" class="btn">▶</button>
  </div>
  <p id="msg" class="text-center my-2 font-semibold"></p>
  <div class="text-center"><button id="drawBtn" class="btn hidden" data-i18n="draw"></button></div>
  <div id="hand"></div>
  <div id="taunts" class="flex flex-wrap gap-2 justify-center"></div>
</section>

<section id="v-lb" class="v hidden space-y-3">
  <table class="w-full text-center bg-slate-800 rounded"><thead><tr><th data-i18n="rank"></th><th></th><th data-i18n="wins"></th><th data-i18n="losses"></th><th data-i18n="score"></th><th data-i18n="rate"></th></tr></thead><tbody id="lbbody"></tbody></table>
  <b data-i18n="history"></b>
  <ul id="hist" class="bg-slate-800 rounded p-3 space-y-1"></ul>
  <button id="backLb" class="btn alt" data-i18n="back"></button>
</section>

</main>
<div id="toast" class="hidden"></div>
<script type="module" src="app.js"></script>
</body>
</html>
